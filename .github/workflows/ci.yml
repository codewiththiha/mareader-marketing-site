name: ci

on:
  push:
    branches: [main2]
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 tools/check_commit_message.py --log
      - run: python3 tools/check_comments.py .
      - run: node tools/visual/evaluate.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-review
          path: |
            tools/visual/shots
            tools/visual/REPORT.md

  publish:
    needs: review
    if: github.event_name == 'push' && github.ref == 'refs/heads/main2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist to main2-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -b main2-dist
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -m "Publish build"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/codewiththiha/mareader-marketing-site.git"
          git push --force origin main2-dist
