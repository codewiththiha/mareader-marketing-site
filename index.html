<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mareader is a calm, native reader for PDF and EPUB. Limitless themes, four panes, your own AI keys or local models, and voices that read aloud from your computer."
    />
    <meta name="theme-color" content="#131316" />
    <title>Mareader — a calm reader for PDF and EPUB</title>
    <script>
      (function () {
        try {
          var s = localStorage.getItem("mareader-site-theme");
          var d = s ? s === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          if (d) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
