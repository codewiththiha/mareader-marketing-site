source = "https://github.com/rsms/inter via @fontsource-variable/inter 5.3.0"
license = "OFL-1.1"
license_file = "src/assets/fonts/LICENSE-Inter.txt"
sha256 = "3100e775e8616cd2611beecfa23a4263d7037586789b43f035236a2e6fbd4c62"
usage = "Interface type: headings, labels, running UI text, numbers"

