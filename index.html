 a strong moral principle to prevent me from deliberately stepping into the street, and methodically knocking people’s hats off—then, I account it high time to get to sea as soon as I can.`,`There now is your insular city of the Manhattoes, belted round by wharves as Indian isles by coral reefs—commerce surrounds it with her surf. Right and left, the streets take you waterward. Its extreme downtown is the battery, where that noble mole is washed by waves, and cooled by breezes, which a few hours previous were out of sight of land. Look at the crowds of water-gazers there.`,`Circumambulate the city of a dreamy Sabbath afternoon. Go from Corlears Hook to Coenties Slip, and from thence, by Whitehall, northward. What do you see?—Posted like silent sentinels all around the town, stand thousands upon thousands of mortal men fixed in ocean reveries.`]},la={chapter:`Chapter 1`,heading:``,paragraphs:[`It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife.`,`However little known the feelings or views of such a man may be on his first entering a neighbourhood, this truth is so well fixed in the minds of the surrounding families, that he is considered as the rightful property of some one or other of their daughters.`,`“My dear Mr. Bennet,” said his lady to him one day, “have you heard that Netherfield Park is let at last?”`,`Mr. Bennet replied that he had not.`,`“But it is,” returned she; “for Mrs. Long has just been here, and she told me all about it.”`]},ua={chapter:`Economy`,heading:``,paragraphs:[`When I wrote the following pages, or rather the bulk of them, I lived alone, in the woods, a mile from any neighbor, in a house which I had built myself, on the shore of Walden Pond, in Concord, Massachusetts, and earned my living by the labor of my hands only.`,`I lived there two years and two months. At present I am a sojourner in civilized life again.`,`I should not obtrude my affairs so much on the notice of my readers if very particular inquiries had not been made by my townsmen concerning my mode of life, which some would call impertinent, though they do not appear to me at all impertinent, but, considering the circumstances, very natural and pertinent.`]},da={title:`On the Electrodynamics of Moving Bodies`,author:`A. Einstein`,note:`Annalen der Physik, 17 (1905), 891–921`,abstract:`It is known that Maxwell’s electrodynamics—as usually understood at the present time—when applied to moving bodies, leads to asymmetries which do not appear to be inherent in the phenomena. Take, for example, the reciprocal electrodynamic action of a magnet and a conductor. The observable phenomenon here depends only on the relative motion of the conductor and the magnet, whereas the customary view draws a sharp distinction between the two cases in which either the one or the other of these bodies is in motion.`,body:[`Examples of this sort, together with the unsuccessful attempts to discover any motion of the earth relatively to the “light medium,” suggest that the phenomena of electrodynamics as well as of mechanics possess no properties corresponding to the idea of absolute rest.`,`We will raise this conjecture (the purport of which will hereafter be called the “Principle of Relativity”) to the status of a postulate, and also introduce another postulate, which is only apparently irreconcilable with the former, namely, that light is always propagated in empty space with a definite velocity c which is independent of the state of motion of the emitting body.`,`The theory to be developed is based—like all electrodynamics—on the kinematics of the rigid body, since the assertions of any such theory have to do with the relationships between rigid bodies (systems of co-ordinates), clocks, and electromagnetic processes.`,`If we wish to describe the motion of a material point, we give the values of its co-ordinates as functions of the time. Now we must bear carefully in mind that a mathematical description of this kind has no physical meaning unless we are quite clear as to what we understand by “time.”`]},fa=`Call me Ishmael. Some years ago—never mind how long precisely—having little or no money in my purse, and nothing particular to interest me on shore, I thought I would sail about a little and see the watery part of the world.`,pa={moby:ca,pride:la,walden:ua,raven:ca,dracula:ua},ma=[[`Themes`,`#themes`],[`Panes`,`#panes`],[`AI`,`#ai`],[`Read aloud`,`#read-aloud`],[`Download`,`#download`]],ha={base:`light`,hue:34,strength:0,texture:`none`,textureOpacity:90,textureScale:100,noise:`off`,noiseIntensity:25},ga=[{id:`sepia`,name:`Sepia`,look:{...ha,hue:34,strength:23}},{id:`green`,name:`Green`,look:{...ha,hue:104,strength:20}},{id:`night`,name:`Night`,look:{...ha,base:`dark`,hue:110,strength:18}},{id:`parchment`,name:`Parchment`,look:{...ha,hue:40,strength:28,texture:`paper`,textureOpacity:85,textureScale:110,noise:`static`,noiseIntensity:18}},{id:`cinema`,name:`Cinema`,look:{...ha,base:`dim`,hue:220,strength:15,noise:`animated`,noiseIntensity:30}}],_a=[[34,`Sepia`],[14,`Rose`],[104,`Green`],[160,`Mint`],[200,`Sky`],[240,`Blue`],[290,`Violet`]],va=50,ya=.06,ba=.035,xa=.05,Sa=e=>e<=.04045?e/12.92:((e+.055)/1.055)**2.4,Ca=e=>e<=.0031308?e*12.92:1.055*e**(1/2.4)-.055,wa=e=>Math.min(1,Math.max(0,e)),Ta=e=>Math.round(wa(e)*255);function Ea(e){return`#`+e.map(e=>e.toString(16).padStart(2,`0`)).join(``)}function Q(e){let t=e.replace(`#`,``);return[parseInt(t.slice(0,2),16),parseInt(t.slice(2,4),16),parseInt(t.slice(4,6),16)]}function Da([e,t,n]){let[r,i,a]=[e,t,n].map(e=>Sa(e/255)),o=.4122214708*r+.5363325363*i+.0514459929*a,s=.2119034982*r+.6806995451*i+.1073969566*a,c=.0883024619*r+.2817188376*i+.6299787005*a,l=Math.cbrt(o),u=Math.cbrt(s),d=Math.cbrt(c),f=.2104542553*l+.793617785*u-.0040720468*d,p=1.9779984951*l-2.428592205*u+.4505937099*d,m=.0259040371*l+.7827717662*u-.808675766*d,h=Math.atan2(m,p)*180/Math.PI;return{l:f,c:Math.sqrt(p*p+m*m),h:(h%360+360)%360}}function lights:[`Any book reads aloud in system voices or neural voices that download once and run offline.`,`Dictionary and AI cards show pronunciation as IPA or an easy respelling, and say the word aloud.`,`Books edited elsewhere reload by themselves within about two seconds, keeping your place.`,`Closed books let go of their memory; a long book closes about 30 MiB lower.`],assets:pd(`v0.0.4`)},{version:`v0.0.3`,date:`2026-10-20`,tagline:`Page AI arrives.`,highlights:[`Right-click a page to summarize, translate or simplify it; the result stays with the book.`,`In EPUB, Markdown and text books a result is laid into the book in your own type.`,`Continuous mode asks the next few pages ahead after a short stay on a finished page.`,`PDF results get their own font, size and spacing in Settings › Appearance.`],assets:pd(`v0.0.3`)},{version:`v0.0.2`,date:`2026-10-18`,tagline:`A dictionary of its own, and a rebuilt Library.`,highlights:[`A full dictionary page and a floating one: move it, resize it, fold it to a pill, or open it as a page.`,`Notes on any highlight, bookmarks, and export of highlights and notes.`,`A home-screen library grid you arrange by dragging, with shelves made by stacking books.`,`Burmese and other complex scripts shaped correctly in every panel.`],assets:pd(`v0.0.2`)},{version:`v0.0.1`,date:`2026-10-16`,tagline:`The first build.`,highlights:[`A calm reader for PDF, EPUB, plain text and Markdown, native with no webview.`,`Up to four panes, each with its own theme, paper, tint, texture and grain.`,`Highlights, gloss cards, offline dictionaries, CEFR word levels and AI explain.`,`Search in both formats, and full keyboard control throughout.`],assets:pd(`v0.0.1`)}],_d=gd[0],vd=B(`<span class="rounded-full border border-line bg-surface/70 px-2 py-0.5 text-[11.5px] font-normal text-muted">detected</span>`),yd=B(`<button class="group relative z-10 flex h-12 items-center gap-3 rounded-[12px] px-4 text-left text-[15px] font-medium transition-colors"><!> <!> <span cla
