name: ci

on:
  push:
    branches: [main2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Commit message policy
        run: python3 tools/check_commit_message.py --log
      - name: Comment policy
        run: python3 tools/check_comments.py .
      - name: Self-review
        run: node tools/visual/evaluate.mjs
      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-review
          path: |
            tools/visual/shots/*.png
            tools/visual/REPORT.md

  publish:
    needs: review
    if: github.event_name == 'push' && github.ref == 'refs/heads/main2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish dist on green review
        run: |
          cd dist
          git init -b main2-dist
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add .
          git commit -m "Publish build"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/codewiththiha/mareader-marketing-site.git"
          git push --force origin main2-dist
