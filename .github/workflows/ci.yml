name: ci
on:
  push:
    branches: [main10]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm run test
      - run: npm audit --audit-level=low
      - run: python3 scripts/guard.py repo
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium --only-shell
      - run: npm run shots
      - run: npm run visual
      - run: npm run review
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: |
            .shots
            .visual-diff
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium --only-shell
      - run: python3 -m pip install --user numpy pillow
      - run: node scripts/bake-lens.cjs "$PWD/dist/index.html" /tmp/bake
      - run: python3 scripts/lens-blur.py /tmp/bake /tmp/blur-new
      - run: python3 scripts/compare-blur.py src/blur /tmp/blur-new
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/guard.py commits
